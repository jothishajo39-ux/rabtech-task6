[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-tool"
version = "1.0.0"
description = "Automated PDF report generator with CLI and scheduling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "reportlab>=4.0",
    "requests>=2.31",
    "click>=8.1",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
report = "report_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
